<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>極簡畫面廣播 (真 IP 直連版)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #fff; text-align: center; padding: 20px; }
    .controls { margin-bottom: 16px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    input, button { padding: 10px 16px; font-size: 15px; border-radius: 6px; border: none; }
    input { background: #1f2937; color: #fff; border: 1px solid #374151; }
    button { cursor: pointer; font-weight: bold; }
    .btn-host { background: #10b981; color: #fff; }
    .btn-join { background: #3b82f6; color: #fff; }
    video { width: 92%; max-width: 1200px; min-height: 360px; background: #000; border-radius: 8px; border: 1px solid #374151; }
    #status { color: #fbbf24; font-size: 16px; margin-bottom: 8px; font-weight: bold; }
    #iceStatus { color: #34d399; font-size: 13px; margin-bottom: 16px; font-family: monospace; }
  </style>
</head>
<body>

  <h2>⚡ 即時畫面廣播 (解鎖真 IP 直連版)</h2>
  <div id="status">請輸入房間暗號（例如：bmsb）然後撳掣</div>
  <div id="iceStatus">系統待命中...</div>

  <div class="controls">
    <input type="text" id="roomId" placeholder="輸入暗號 (如: bmsb)" value="bmsb" />
    <button class="btn-host" onclick="startBroadcast()">1. 我要 Share 畫面 (Host)</button>
    <button class="btn-join" onclick="watchBroadcast()">2. 我要睇人畫面 (Viewer)</button>
  </div>

  <video id="screenVideo" autoplay playsinline controls muted></video>

  <script>
    const statusEl = document.getElementById('status');
    const iceEl = document.getElementById('iceStatus');
    const videoEl = document.getElementById('screenVideo');
    let localStream = null;
    let peer = null;

    // 只用最快嘅 Google STUN (0.018s 反應)，移除失效嘅 openrelay
    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    // 關鍵秘技：好似 Trickle ICE 剔選格仔咁，短暫請求權限以解鎖真實 144.214.x.x IP（消除 .local 亂碼）
    async function unlockRealIP() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        tempStream.getTracks().forEach(t => t.stop()); // 攞完權限即刻熄咪，唔會錄音
      } catch (e) {
        console.log('未能解鎖 mDNS，將嘗試使用 STUN srflx:', e);
      }
    }

    function createActiveDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 2;
      canvas.height = 2;
      const ctx = canvas.getContext('2d');
      setInterval(() => {
        ctx.fillStyle = `rgb(${Math.floor(Math.random()*255)}, 0, 0)`;
        ctx.fillRect(0, 0, 2, 2);
      }, 500);
      return canvas.captureStream(10);
    }

    // 【廣播端 Host】
    async function startBroadcast() {
      const room = document.getElementById('roomId').value.trim();
      if (!room) return alert('請先輸入房間暗號！');

      statusEl.innerText = '⏳ 正在解鎖網絡通道並擷取畫面...';
      await unlockRealIP();

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        videoEl.srcObject = localStream;
        videoEl.play().catch(() => {});

        if (peer) peer.destroy();
        peer = new Peer('hk-ip-' + room, peerConfig);

        peer.on('open', (id) => {
          statusEl.innerText = `✅ 廣播就緒！叫同事輸入「${room}」再撳「2. 我要睇人畫面」`;
          iceEl.innerText = `Host ID: ${id} (真 IP 已解鎖，等待連線...)`;
        });

        peer.on('call', (call) => {
          statusEl.innerText = `🟢 同事已連入！正在直連傳送畫面...`;
          call.answer(localStream);
          monitorIce(call.peerConnection);
        });

        peer.on('error', (err) => {
          statusEl.innerText = '❌ 錯誤 (' + err.type + ')：請改用第二個暗號再試';
        });

      } catch (err) {
        statusEl.innerText = '❌ 擷取畫面被取消：' + err.message;
      }
    }

    // 【觀眾端 Viewer】
    async function watchBroadcast() {
      const room = document.getElementById('roomId').value.trim();
      if (!room) return alert('請先輸入房間暗號！');

      statusEl.innerText = '⏳ 正在解鎖真實 IP 並連接 Host（如彈出權限請按允許）...';
      await unlockRealIP();

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        const dummyStream = createActiveDummyStream();
        const call = peer.call('hk-ip-' + room, dummyStream);

        if (!call) {
          statusEl.innerText = '❌ 無法建立通話';
          return;
        }

        monitorIce(call.peerConnection);

        call.on('stream', (remoteStream) => {
          if (videoEl.srcObject !== remoteStream) {
            videoEl.srcObject = remoteStream;
            videoEl.play().catch(e => console.log('Autoplay:', e));
            statusEl.innerText = '🎉 成功收到畫面！（如無反應請點一下播放框）';
          }
        });
      });

      peer.on('error', (err) => {
        statusEl.innerText = `❌ 連線錯誤 (${err.type})：請確認 Host 已開房！`;
      });
    }

    function monitorIce(pc) {
      if (!pc) return;
      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        iceEl.innerText = `網絡通道狀態 (ICE): ${state}`;
        if (state === 'connected' || state === 'completed') {
          iceEl.innerText = `🚀 網絡通道狀態 (ICE): ${state} (直連成功！)`;
        }
      };
    }
  </script>
</body>
</html>
